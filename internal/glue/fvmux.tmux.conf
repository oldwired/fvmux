# fvmux's tmux glue — only attach/detach is wanted from tmux.
# Everything else stays out of the way so fvmux owns the screen.
#
# Loaded by scripts/fvmuxa via `tmux -f`. NOT applied to your other
# tmux sessions (those use ~/.tmux.conf as usual).

# Prefix on F12 — avoids any clash with fvmux's Ctrl-G and the common
# Ctrl-B / Ctrl-A choices for normal tmux setups.
unbind C-b
set -g prefix F12
bind   F12 send-prefix

# Detach: F12 d (the default detach binding under tmux's prefix).
# Reattach: run `fvmuxa` again.

# fvmux owns the bottom row, the title, and the mouse.
set  -g status      off
set  -g mouse       off
set  -g allow-rename off
set  -g set-titles  off

# Make the tmux server exit when no sessions remain. Modern tmux
# defaults to `on`; setting it explicitly keeps behaviour stable on
# older systems.
set -g exit-empty on

# Terminal capabilities — 256 colours + true-colour negotiation so
# fvmux's themes render correctly through tmux.
set  -g default-terminal "xterm-256color"
set -ga terminal-features "*:RGB"

# Modest scrollback — fvmux has its own; this is just defence in
# depth for the rare line tmux captures before fvmux starts.
set -g history-limit 1000
