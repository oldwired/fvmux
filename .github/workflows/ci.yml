name: ci
on:
  push:
    branches: [main]
  pull_request:

# Minimal-by-default token scope. Every job in this workflow only
# needs to read repo contents (checkout, run tests, fetch deps).
# Explicit permissions block prevents GITHUB_TOKEN from inheriting
# broader rights from repo/org defaults.
permissions:
  contents: read

jobs:
  test:
    name: build + test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # fvmux's go.mod references fv-go via a local `replace`. CI
      # checkouts must materialise that path so go build can resolve it.
      - name: Checkout fv-go alongside
        uses: actions/checkout@v6
        with:
          repository: oldwired/fv-go
          path: ../fv-go

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout fv-go alongside
        uses: actions/checkout@v6
        with:
          repository: oldwired/fv-go
          path: ../fv-go
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  cross-compile-windows:
    name: cross-compile (windows/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: oldwired/fv-go
          path: ../fv-go
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Windows build
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout fv-go alongside
        uses: actions/checkout@v6
        with:
          repository: oldwired/fv-go
          path: ../fv-go
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # gofmt is non-fatal in go itself but a hard fail here — any
      # unformatted file leaves a noisy diff for future contributors.
      - name: gofmt
        run: |
          diff=$(gofmt -l -d .)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo
            echo "Files above are not gofmt-clean. Run 'gofmt -w .' locally."
            exit 1
          fi

      - name: golangci-lint
        # golangci-lint-action v7+ is required for golangci-lint v2.x;
        # v6 only supports v1.x and rejects "v2.*" version strings.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      # govulncheck-action handles checkout + Go install internally
      # (repo-checkout: true is the default, and the action runs its
      # own setup-go). It uses actions/checkout@v4.1.1 internally,
      # which conflicts with credentials persisted by a v6 checkout
      # in the same job — so we don't run our own checkout here.
      # Note: fvmux's local `replace` points at ../fv-go which won't
      # exist in this isolated checkout. govulncheck still analyses
      # the modules go.sum resolves; gaps from the local replace are
      # acceptable because the replace-guard job exercises a clean
      # build without it.
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  replace-guard:
    name: release-only build (no local replace)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Strip replace directive
        run: |
          before=$(grep -c '^replace ' go.mod || true)
          sed -i '/^replace github.com\/oldwired\/fv-go /d' go.mod
          after=$(grep -c '^replace ' go.mod || true)
          if [ "$before" = "$after" ]; then
            echo "replace directive not stripped; release build needs a published fv-go tag" >&2
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy
      - name: Build
        run: go build ./...
