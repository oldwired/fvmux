name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # fvmux's go.mod references fv-go via a local `replace`. CI
      # checkouts must materialise that path so go build can resolve it.
      - name: Checkout fv-go alongside
        uses: actions/checkout@v4
        with:
          repository: oldwired/fv-go
          path: ../fv-go

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

  cross-compile-windows:
    name: cross-compile (windows/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oldwired/fv-go
          path: ../fv-go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Windows build
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  replace-guard:
    name: release-only build (no local replace)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Strip replace directive
        run: |
          before=$(grep -c '^replace ' go.mod || true)
          sed -i '/^replace github.com\/oldwired\/fv-go /d' go.mod
          after=$(grep -c '^replace ' go.mod || true)
          if [ "$before" = "$after" ]; then
            echo "replace directive not stripped; release build needs a published fv-go tag" >&2
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy
      - name: Build
        run: go build ./...
