name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: build binary for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Strip local replace
        run: |
          sed -i '/^replace github.com\/oldwired\/fv-go /d' go.mod
          go mod tidy

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -o dist/fvmux-${{ matrix.os }}-${{ matrix.arch }}${ext} ./cmd/fvmux

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
