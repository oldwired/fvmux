name: Release

on:
  push:
    tags:
      - 'v*'

# softprops/action-gh-release uploads assets to the GitHub release,
# which requires write access to repo contents. Everything else this
# workflow does (checkout, build, syft) only needs read, but the
# upload step forces the wider scope. Pinning it explicitly keeps
# the token from inheriting anything broader from repo/org defaults.
permissions:
  contents: write

jobs:
  # The verify-* jobs mirror ci.yml so the release gate fails on the
  # same conditions a normal PR would. Duplication is intentional —
  # the alternative (workflow_run, reusable workflows) adds indirection
  # for a workflow that runs at most once per tag.

  verify-test:
    name: test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  verify-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  verify-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          diff=$(gofmt -l -d .)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo
            echo "Files above are not gofmt-clean. Run 'gofmt -w .' locally."
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  verify-vuln:
    runs-on: ubuntu-latest
    steps:
      # govulncheck-action handles checkout + Go install internally.
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  build-binaries:
    name: build binary for ${{ matrix.os }}/${{ matrix.arch }}
    needs: [verify-test, verify-race, verify-lint, verify-vuln]
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false here is deliberate. A partial binary set never
      # reaches the release (assemble-release needs every matrix entry),
      # so killing surviving builds early just hides which platforms
      # regressed.
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -o dist/fvmux-${{ matrix.os }}-${{ matrix.arch }}${ext} ./cmd/fvmux

      # Stage binaries as workflow artifacts rather than uploading to
      # the release directly — assemble-release downloads all of them
      # so it can produce a single checksums.txt that covers the full
      # set (and so the release stays empty if any platform fails).
      - name: Stage binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  assemble-release:
    name: assemble release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # SBOM is generated from the source tree (go.mod/go.sum drive the
      # Go module catalogue). Done before downloading binaries so syft
      # doesn't try to introspect them as separate artifacts.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM
        run: syft scan dir:. -o spdx-json=fvmux.spdx.json

      - name: Collect binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      # LICENSE ships alongside the binaries so a user who downloads a
      # release asset has the MIT terms in hand without having to visit
      # the repo. The full third-party notice tree (incl. fv-go's
      # LGPL-2.1) is enumerated in fvmux.spdx.json next to it.
      - name: Stage LICENSE
        run: cp LICENSE dist/LICENSE

      # sha256 over binaries + LICENSE + SBOM, but not over
      # checksums.txt itself. Listing files explicitly avoids the
      # self-reference and keeps the checksum set deterministic
      # regardless of dist/ ordering.
      - name: Generate checksums
        run: |
          mv fvmux.spdx.json dist/
          cd dist
          sha256sum fvmux-* LICENSE fvmux.spdx.json > checksums.txt
          cat checksums.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
